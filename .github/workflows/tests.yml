name: Unit Tests

# ---------------------------------------------------------------
# ENHANCEMENT: efficient triggering
#  1. branches  -> run only for pushes/PRs that target main,
#                  not every push to every feature branch
#  2. paths     -> skip runs when only non-code files change
#                  (README, docs, the test document, etc.)
#  3. pull_request -> test code BEFORE it is merged into main
#  4. concurrency  -> a newer push cancels the older, outdated run
#  5. workflow_dispatch -> allow a manual run (e.g. for a demo)
# ---------------------------------------------------------------
on:
  push:
    branches: [main]
    paths:
      - "**.py"
      - "pytest.ini"
      - "requirements.txt"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "**.py"
      - "pytest.ini"
      - "requirements.txt"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: pytest -v

